<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WordLens 划词词典</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup">
  <header class="popup-header"><div class="identity"><img src="icons/48.png" width="38" height="38" alt=""><div><h1>WordLens</h1><p>读到哪里，理解到哪里。</p></div></div><span class="label">词典 + 翻译</span></header>
  <main>
    <form id="search-form" class="search" role="search"><label class="sr-only" for="query">输入英文单词、短语或句子（最多 2000 个字符）</label><textarea id="query" autocomplete="off" spellcheck="false" rows="2" placeholder="输入英文单词、短语或句子（最多 2000 字符）…" autofocus></textarea><button type="submit" aria-label="查询或翻译">查询</button></form>
    <section id="search-result" class="search-result" aria-live="polite" hidden></section>
    <section class="local-help" aria-label="本地 HTML 文件访问"><span id="file-access-status">正在检查本地 HTML 支持…</span><button id="file-access-settings" type="button">扩展详情 ↗</button><p id="file-access-hint" hidden>打开详情后，开启“允许访问文件 URL”，再刷新本地 HTML 页面。</p></section>
    <section class="local-help" aria-label="英语语音检查"><span id="voice-status" role="status">正在检查本地英语语音…</span><button id="voice-check" type="button">重新检查</button><button id="voice-test" type="button">测试发音</button><a href="guide.html#speech-help" target="_blank">安装帮助 ↗</a><p id="voice-hint" hidden></p></section>
    <section class="settings" aria-label="插件设置">
      <label class="setting-row"><span><strong>网页划词 / 划句</strong><small>选中单词、短语或句子，查看中文</small></span><span class="switch"><input id="enabled" type="checkbox" role="switch"><span class="track"></span></span></label>
      <label class="setting-row"><span><strong>联网翻译</strong><small>未收录的短语和句子发送至 MyMemory</small></span><span class="switch"><input id="onlineTranslation" type="checkbox" role="switch"><span class="track"></span></span></label>
      <label class="setting-row"><span><strong>触发方式</strong><small>按住 Alt 可减少阅读时的打扰</small></span><select id="trigger" aria-label="触发方式"><option value="selection">选中即查</option><option value="alt">Alt + 选中</option></select></label>
      <label class="setting-row"><span><strong>发音偏好</strong><small>本地语音；音标以词典标注为准</small></span><select id="accent" aria-label="发音偏好"><option value="en-GB">英式优先</option><option value="en-US">美式优先</option></select></label>
    </section>
    <p id="status" class="status" role="status">本地词典优先；联网翻译仅发送所选文字。不保存历史。</p>
  </main>
  <footer class="popup-footer"><span>v1.1.2 · Enter 查询 / Shift+Enter 换行</span><a id="guide-link" href="guide.html" target="_blank">指南 ↗</a></footer>
  <script src="core.js"></script><script src="popup.js"></script>
</body>
</html>
